<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}

    <!-- Favicon and touch icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon/apple-touch-icon.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon/favicon-16x16.png' | relative_url }}">
    
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | absolute_url }}">

    <script>
    // Set theme before paint to avoid a flash of the wrong palette.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
    </script>
</head>
<body>
    {% include header.html %}
    
    {% if page.show_lotus %}
    <div class="lotus-container">
        <canvas class="hero-field" id="hero-field"></canvas>
        <div class="lotus">
            <div class="petals">
                <div class="petal" style="--rotation: 0deg;"></div>
                <div class="petal" style="--rotation: 72deg;"></div>
                <div class="petal" style="--rotation: 144deg;"></div>
                <div class="petal" style="--rotation: 216deg;"></div>
                <div class="petal" style="--rotation: 288deg;"></div>
            </div>
            <div class="center"></div>
        </div>
    </div>
    {% endif %}
    
    <div class="content">
        {{ content }}
    </div>
    
    {% include footer.html %}
    
    <svg width="0" height="0">
        <filter id="turbulence">
            <feTurbulence baseFrequency="0.01" numOctaves="3" result="turbulence" />
            <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="10" />
        </filter>
    </svg>

    <script>
    // Hero dot-matrix: a near-regular lattice, mostly hidden, with travelling
    // patches of visibility. Order condenses into small dispersed lotus blooms
    // that emerge and dissolve; a central guard keeps them clear of the lotus.
    (() => {
      const canvas = document.getElementById('hero-field');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const lotusEl = document.querySelector('.lotus');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const C = {
        coral:      [242, 184, 164],
        rose:       [215, 159, 159],
        lavender:   [200, 182, 216],
        rust:       [166,  69,  62],
        pomegranate:[163,  44,  50],
      };
      const NOISE_RGB = [150, 138, 142];
      const RAMP = [
        { t: 0.00, c: C.pomegranate },
        { t: 0.18, c: C.rust },
        { t: 0.42, c: C.rose },
        { t: 0.70, c: C.coral },
        { t: 1.00, c: C.lavender },
      ];
      function rampColor(t) {
        t = Math.max(0, Math.min(1, t));
        for (let i = 1; i < RAMP.length; i++) {
          if (t <= RAMP[i].t) {
            const a = RAMP[i - 1], b = RAMP[i];
            const k = (t - a.t) / (b.t - a.t);
            return [a.c[0]+(b.c[0]-a.c[0])*k, a.c[1]+(b.c[1]-a.c[1])*k, a.c[2]+(b.c[2]-a.c[2])*k];
          }
        }
        return RAMP[RAMP.length - 1].c;
      }
      function smoothstep(a, b, x) {
        const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      }

      const BLOOMS = [
        { x: 0.16, y: 0.26, R: 0.14, petals: 5, rot: 0.80, period: 17, phase: 0.35, active: 0.52, weight: 0.95 },
        { x: 0.85, y: 0.66, R: 0.15, petals: 6, rot: 1.60, period: 21, phase: 0.62, active: 0.54, weight: 0.95 },
        { x: 0.82, y: 0.20, R: 0.11, petals: 5, rot: 2.40, period: 14, phase: 0.10, active: 0.46, weight: 0.8 },
        { x: 0.24, y: 0.76, R: 0.12, petals: 6, rot: 0.10, period: 19, phase: 0.80, active: 0.46, weight: 0.8 },
        { x: 0.07, y: 0.60, R: 0.09, petals: 5, rot: 3.10, period: 12, phase: 0.50, active: 0.42, weight: 0.7 },
        { x: 0.93, y: 0.38, R: 0.09, petals: 5, rot: 1.10, period: 15, phase: 0.05, active: 0.42, weight: 0.7 },
        { x: 0.10, y: 0.40, R: 0.10, petals: 6, rot: 2.05, period: 16, phase: 0.22, active: 0.48, weight: 0.85 },
        { x: 0.90, y: 0.84, R: 0.11, petals: 5, rot: 0.45, period: 23, phase: 0.70, active: 0.50, weight: 0.8 },
        { x: 0.40, y: 0.11, R: 0.10, petals: 6, rot: 1.85, period: 18, phase: 0.42, active: 0.46, weight: 0.8 },
        { x: 0.63, y: 0.09, R: 0.08, petals: 5, rot: 2.70, period: 13, phase: 0.88, active: 0.40, weight: 0.65 },
        { x: 0.31, y: 0.91, R: 0.09, petals: 5, rot: 0.95, period: 20, phase: 0.15, active: 0.44, weight: 0.7 },
        { x: 0.71, y: 0.90, R: 0.08, petals: 6, rot: 3.40, period: 16, phase: 0.55, active: 0.42, weight: 0.65 },
        { x: 0.05, y: 0.85, R: 0.08, petals: 5, rot: 1.40, period: 22, phase: 0.30, active: 0.40, weight: 0.6 },
        { x: 0.96, y: 0.12, R: 0.08, petals: 5, rot: 0.25, period: 14, phase: 0.95, active: 0.40, weight: 0.6 },
      ];
      // Guard ellipse keeps blooms off the lotus. Measured from the actual
      // .lotus box each build() so it tracks the graphic at any size/scale
      // (e.g. the mobile scale-down), with padding for breathing room.
      let guardCX = 0, guardCY = 0, guardRX = 1, guardRY = 1;
      const GUARD_PAD = 1.12;

      function bloomIntensity(b, t) {
        const u = ((t / b.period) + b.phase) % 1;
        const v = u / b.active;
        if (v >= 1) return 0;
        return Math.pow(Math.sin(Math.PI * v), 1.25);
      }
      function petalMembership(b, dx, dy, R) {
        const dist = Math.hypot(dx, dy);
        if (dist > R * 1.05) return 0;
        const norm = dist / R;
        const ang = Math.atan2(dy, dx) - b.rot;
        const lobe = Math.max(0, Math.cos(b.petals * ang));
        const edge = 0.30 + 0.70 * Math.pow(lobe, 0.5);
        const m = 1 - smoothstep(edge - 0.14, edge, norm);
        const core = 1 - smoothstep(0.06, 0.20, norm);
        return Math.max(m, core * 0.9);
      }

      let W = 0, H = 0, dpr = 1, dots = [];
      const SPACING = 20;
      function build() {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = rect.width; H = rect.height;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const lr = lotusEl && lotusEl.getBoundingClientRect();
        if (lr && lr.width && lr.height) {
          guardCX = lr.left - rect.left + lr.width / 2;
          guardCY = lr.top - rect.top + lr.height / 2;
          guardRX = (lr.width / 2) * GUARD_PAD;
          guardRY = (lr.height / 2) * GUARD_PAD;
        } else {
          guardCX = 0.50 * W; guardCY = 0.50 * H;
          guardRX = 0.34 * W; guardRY = 0.30 * H;
        }

        dots = [];
        const cols = Math.ceil(W / SPACING) + 1;
        const rows = Math.ceil(H / SPACING) + 1;
        for (let j = 0; j < rows; j++) {
          for (let i = 0; i < cols; i++) {
            const seed = (i * 73856093) ^ (j * 19349663);
            const r1 = ((seed & 0xffff) / 0xffff) - 0.5;
            const r2 = (((seed >> 8) & 0xffff) / 0xffff) - 0.5;
            dots.push({
              bx: i * SPACING + r1 * SPACING * 0.12,
              by: j * SPACING + r2 * SPACING * 0.12,
              ph: ((seed >>> 0) % 1000) / 1000 * Math.PI * 2,
              sp: 0.75 + (((seed >> 3) & 0xff) / 0xff) * 0.5,
            });
          }
        }
      }
      const minDim = () => Math.min(W, H);

      function frame(now) {
        if (!W || !H) { if (!reduce) requestAnimationFrame(frame); return; }
        const t = reduce ? 8 : now / 1000;
        ctx.clearRect(0, 0, W, H);

        const md = minDim();
        const live = BLOOMS.map(b => {
          const inten = bloomIntensity(b, t) * b.weight;
          return inten > 0.01 ? { cx: b.x*W, cy: b.y*H, R: b.R*md, b, inten } : null;
        }).filter(Boolean);

        const jBase = SPACING * 0.12;
        const gx = guardCX, gy = guardCY;
        const grx = guardRX, gry = guardRY;
        const FAINT = 0.05, MAXN = 0.30;

        for (let d = 0; d < dots.length; d++) {
          const dot = dots[d];
          const ndx = (dot.bx - gx) / grx, ndy = (dot.by - gy) / gry;
          const guard = smoothstep(0.85, 1.20, Math.hypot(ndx, ndy));

          let order = 0, colT = 0;
          if (guard > 0) {
            for (let k = 0; k < live.length; k++) {
              const L = live[k];
              const m = petalMembership(L.b, dot.bx - L.cx, dot.by - L.cy, L.R);
              if (m <= 0) continue;
              const o = m * L.inten;
              if (o > order) { order = o; colT = Math.hypot(dot.bx - L.cx, dot.by - L.cy) / L.R; }
            }
          }
          order = Math.min(1, order) * guard;

          const calm = 1 - 0.7 * order;
          const ox = Math.sin(t * 0.22 + dot.bx * 0.015 + dot.ph) * jBase * calm;
          const oy = Math.cos(t * 0.19 + dot.by * 0.016 + dot.ph) * jBase * calm;
          const x = dot.bx + ox, y = dot.by + oy;

          const g = Math.sin(dot.bx * 0.010 + t * 0.20)
                  + Math.sin(dot.by * 0.013 - t * 0.16)
                  + Math.sin((dot.bx + dot.by) * 0.008 + t * 0.12)
                  + Math.sin((dot.bx - dot.by) * 0.011 - t * 0.18);
          const field = 0.5 + 0.5 * (g / 4);
          const reveal = smoothstep(0.42, 0.88, field);
          const flicker = 0.8 + 0.2 * Math.sin(t * 1.6 + dot.ph);

          const noiseOpacity = (FAINT + (MAXN - FAINT) * reveal) * dot.sp * flicker;
          const op = noiseOpacity + (0.92 - noiseOpacity) * order;

          const baseR = 1.05;
          const bloomR = 2.5 + 0.5 * Math.sin(t * 1.3 + dot.ph);
          const r = baseR + (bloomR - baseR) * order;

          const fc = rampColor(colT);
          const cr = NOISE_RGB[0] + (fc[0] - NOISE_RGB[0]) * order;
          const cg = NOISE_RGB[1] + (fc[1] - NOISE_RGB[1]) * order;
          const cb = NOISE_RGB[2] + (fc[2] - NOISE_RGB[2]) * order;

          ctx.beginPath();
          ctx.fillStyle = `rgba(${cr|0},${cg|0},${cb|0},${op})`;
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();

          if (order > 0.6) {
            ctx.beginPath();
            ctx.fillStyle = `rgba(${cr|0},${cg|0},${cb|0},${(order - 0.6) * 0.25})`;
            ctx.arc(x, y, r * 2.4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        if (!reduce) requestAnimationFrame(frame);
      }

      let rt;
      window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
      build();
      requestAnimationFrame(frame);
    })();
    </script>

    <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      var root = document.documentElement;
      function sync() {
        btn.textContent = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      }
      sync();
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        sync();
      });
    })();
    </script>
</body>
</html>
