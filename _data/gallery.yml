# Images for the gallery at /gallery/. Files live in assets/images/gallery/
# as <file>.webp (full) and <file>-thumb.webp (grid). Order here is display
# order — the page deals items across the columns row by row, so entries that
# sit together in this file sit together on the page. Grouped by tag, with the
# untagged ones last; they show only under "all".

