<svg xmlns="http://www.w3.org/2000/svg" width="752" height="719" viewBox="-342 -170 752 719">
  <!-- Standalone vector copy of the site's CSS lotus (assets/css/style.css /
       _layouts/default.html). Petals placed at their original pixel offsets
       and rotated about each petal's center-bottom pivot; teardrop path matches
       border-radius 50% 50% 50% 50% / 80% 80% 20% 20%. Not used by the live
       page yet — kept for reuse. -->
  <defs>
    <filter id="lotusPetalFx" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence baseFrequency="0.01" numOctaves="3" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="10" result="disp"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7.5" flood-color="black" flood-opacity="0.1"/>
    </filter>
    <filter id="lotusCenterGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#a6453e" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="lotusG1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d79f9f"/><stop offset="1" stop-color="#f2b8a4"/>
    </linearGradient>
    <linearGradient id="lotusG2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c8b6d8"/><stop offset="1" stop-color="#d79f9f"/>
    </linearGradient>
    <linearGradient id="lotusG3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b8a4"/><stop offset="1" stop-color="#d79f9f"/>
    </linearGradient>
    <linearGradient id="lotusG4" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d79f9f"/><stop offset="1" stop-color="#c8b6d8"/>
    </linearGradient>
    <linearGradient id="lotusG5" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c8b6d8"/><stop offset="1" stop-color="#f2b8a4"/>
    </linearGradient>

    <radialGradient id="lotusCenterGrad">
      <stop offset="0" stop-color="#a32c32"/>
      <stop offset="0.7" stop-color="#a6453e"/>
    </radialGradient>

    <path id="lotusPetal" d="M 110 0
      A 110 192 0 0 1 220 192
      A 110 48 0 0 1 110 240
      A 110 48 0 0 1 0 192
      A 110 192 0 0 1 110 0 Z"/>
  </defs>

  <g opacity="0.9">
    <g transform="rotate(0 0 120) translate(-110 -120)" filter="url(#lotusPetalFx)">
      <use href="#lotusPetal" fill="url(#lotusG1)"/></g>
    <g transform="rotate(72 80 160) translate(-30 -80)" filter="url(#lotusPetalFx)">
      <use href="#lotusPetal" fill="url(#lotusG2)"/></g>
    <g transform="rotate(144 130 240) translate(20 0)" filter="url(#lotusPetalFx)">
      <use href="#lotusPetal" fill="url(#lotusG3)"/></g>
    <g transform="rotate(216 -60 190) translate(-170 -50)" filter="url(#lotusPetalFx)">
      <use href="#lotusPetal" fill="url(#lotusG4)"/></g>
    <g transform="rotate(288 -30 120) translate(-140 -120)" filter="url(#lotusPetalFx)">
      <use href="#lotusPetal" fill="url(#lotusG5)"/></g>
  </g>

  <circle cx="0" cy="0" r="60" fill="url(#lotusCenterGrad)" filter="url(#lotusCenterGlow)"/>
</svg>
